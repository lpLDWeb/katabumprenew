name: Katabump Auto Renew

on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  renew_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 👇👇👇 这一步绝对不能少！没有它 DrissionPage 启动不了 👇👇👇
      # xvfb 用于提供虚拟显示器，让 Chrome 以 headed 模式运行，
      # 这样 Turnstile 人机验证更有可能自动通过
      - name: Install Chrome & xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Install Dependencies
        run: pip install DrissionPage requests

      - name: Run Renew Script
        env:
          KB_EMAIL: ${{ secrets.KB_EMAIL }}
          KB_PASSWORD: ${{ secrets.KB_PASSWORD }}
          KB_RENEW_URL: ${{ secrets.KB_RENEW_URL }}
          KB_HEADED: '1'
        run: |
          # 带虚拟显示器运行，避免 headless 被 Turnstile 拦截
          xvfb-run -a -s "-screen 0 1920x1080x24" python -u main.py
